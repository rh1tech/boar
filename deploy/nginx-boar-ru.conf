# Russian public site on spb1, using the same site/ build as boar.rh1.tech.
# Install as /etc/nginx/vhosts/boar.rh1.ru.conf after issuing the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name boar.rh1.ru;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://boar.rh1.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name boar.rh1.ru;

    ssl_certificate     /etc/letsencrypt/live/boar.rh1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boar.rh1.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/boar-site;
    index index.html;
    error_page 404 /ru/404.html;

    set $csp "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://boar.rh1.ru; font-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";

    location = /terminal/ws {
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 20m;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location = / {
        rewrite ^ /ru/index.html last;
    }
    location = /index.html {
        rewrite ^ /ru/index.html last;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
