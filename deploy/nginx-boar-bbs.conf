# boar-bbs.rh1.tech: where callers telnet (23) and SSH (2222) to, on spb1.
#
# Reference copy of /etc/nginx/vhosts/boar-bbs.rh1.tech.conf on spb1. Over
# HTTPS it only carries download links for file-echo files (/f/<token>,
# Boar's -files-web on 127.0.0.1:8024); everything else goes to the public
# page at boar.rh1.tech. DNS-only at Cloudflare; Let's Encrypt certificate.

limit_req_zone $binary_remote_addr zone=boar_files:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name boar-bbs.rh1.tech;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name boar-bbs.rh1.tech;

    ssl_certificate     /etc/letsencrypt/live/boar-bbs.rh1.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boar-bbs.rh1.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/boar-bbs.rh1.tech_access.log;
    error_log  /var/log/nginx/boar-bbs.rh1.tech_error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /f/ {
        limit_req zone=boar_files burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8024;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;          # stream large files, do not spool them
        proxy_read_timeout 1h;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8024;
    }
    location / {
        return 301 https://boar.rh1.tech$request_uri;
    }
}
