# binkd for Boar BBS on spb1 (Saint Petersburg, the Russian face). Until
# 2026-10-07 this node ran on nsk1.
#
# Primary: 2:5030/1651 (Net 5030, hub 2:5030/731).
# AKA:     2:410/51.1 under boss 2:410/51 on rbx1 (private backbone).
# Petros is NOT linked here. Russian hubs link here; received mail is
# forwarded into the boss filebox and polled up to rbx1 for the BBS.
#
# Session passwords live in /etc/binkd/nodes.inc.

log /var/log/binkd/binkd.log
loglevel 4
conlog 4
percents

domain fidonet /var/spool/ftn/out 2
domain fido    alias-for fidonet

address 2:5030/1651@fidonet
address 2:410/51.1@fidonet
sysname "Boar BBS"
location "Saint Petersburg, Russia"
sysop "Mikhail Matveev"
nodeinfo 115200,TCP,BINKP

iport 24554
oport 24554
call-delay 60
rescan-delay 60
try 10
hold 10m

send-if-pwd

temp-inbound      /var/spool/ftn/tmp
inbound           /var/spool/ftn/in
inbound-nonsecure /var/spool/ftn/in.insecure
minfree 2048
minfree-nonsecure 2048
kill-dup-partial-files
kill-old-partial-files 1d
kill-old-bsy 12h
pid-file /run/binkd/binkd.pid
prescan

# Hub / host faces without password (passworded lines override in nodes.inc).
node 2:5030/731@fidonet f731.s0t.ru,217.71.231.2 -
node 2:5030/0@fidonet f0.s0t.ru,217.71.231.2 -
node 2:5020/0@fidonet n5020.ru -

# Hand every received mail bundle to the boss filebox, then drop a poll so
# binkd calls rbx1. *F is the received path; do not use *S (SRIF).
exec "/usr/local/lib/boar/ftn-forward-boss.sh *F" *.pkt *.PKT *.su? *.mo? *.tu? *.we? *.th? *.fr? *.sa? *.SU? *.MO? *.TU? *.WE? *.TH? *.FR? *.SA?

include /etc/binkd/nodes.inc
