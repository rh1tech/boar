# binkd for Boar BBS on spb1 (Saint Petersburg): the main node since
# 2026-10-07. Boar runs here and tosses this inbound.
#
# Node:  2:5030/1651 (Net 5030, hub 2:5030/731).
# Relay: rbx1 answers Petros as 2:410/51 and is this node's point
#        2:5030/1651.1 over a private passworded link; it forwards everything
#        it receives here. Petros is NOT linked here directly.
#
# Session passwords live in /etc/binkd/nodes.inc.

log /var/log/binkd/binkd.log
loglevel 4
conlog 4
percents

domain fidonet /var/spool/ftn/out 2
domain fido    alias-for fidonet

address 2:5030/1651@fidonet
sysname "Boar BBS"
location "Saint Petersburg, Russia"
sysop "Mikhail Matveev"
nodeinfo 115200,TCP,BINKP

iport 24554
oport 24554
call-delay 60
rescan-delay 60
try 10
hold 10m

send-if-pwd

temp-inbound      /var/spool/ftn/tmp
inbound           /var/spool/ftn/in
inbound-nonsecure /var/spool/ftn/in.insecure
minfree 2048
minfree-nonsecure 2048
kill-dup-partial-files
kill-old-partial-files 1d
kill-old-bsy 12h
pid-file /run/binkd/binkd.pid
prescan

# Hub / host faces without password (passworded lines override in nodes.inc).
node 2:5030/731@fidonet f731.s0t.ru,217.71.231.2 -
node 2:5030/0@fidonet f0.s0t.ru,217.71.231.2 -
node 2:5020/0@fidonet n5020.ru -

# Tell the sysop by email when mail arrives. *F is the received file path; it
# stays in the inbound for the BBS to toss. (*S is SRIF for file requests.)
exec "/opt/boar/bin/boar-ftn notify -to xtreme@outlook.com *F" *.pkt *.PKT *.su? *.mo? *.tu? *.we? *.th? *.fr? *.sa? *.SU? *.MO? *.TU? *.WE? *.TH? *.FR? *.SA?

include /etc/binkd/nodes.inc
