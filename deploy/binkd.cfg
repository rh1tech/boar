# binkd for Boar BBS (rbx1 / west face). Managed from deploy/binkd.cfg.
#
# Node 2:410/51 assigned by Petros Argyrakis (Net 410).
# Since 2026-10-07 this is the relay face: Boar BBS and its tosser run on
# spb1 as 2:5030/1651. rbx1 is its point 2:5030/1651.1 over a private
# passworded link and forwards everything it receives there.
# Session passwords live in /etc/binkd/nodes.inc (not in git).

log /var/log/binkd/binkd.log
loglevel 4
conlog 4
percents

domain fidonet /var/spool/ftn/out 2
domain fido    alias-for fidonet

address 2:410/51@fidonet
address 2:5030/1651.1@fidonet
sysname "Boar BBS"
location "Thessaloniki, Greece"
sysop "Mikhail Matveev"
nodeinfo 115200,TCP,BINKP

iport 24554
oport 24554
call-delay 60
rescan-delay 60
try 10
hold 10m

# Mail waiting for a node is only handed over in a password-protected
# session, or when we call it ourselves.
send-if-pwd

temp-inbound      /var/spool/ftn/tmp
inbound           /var/spool/ftn/in
inbound-nonsecure /var/spool/ftn/in.insecure
minfree 2048
minfree-nonsecure 2048
kill-dup-partial-files
kill-old-partial-files 1d
kill-old-bsy 12h
pid-file /run/binkd/binkd.pid
prescan

# Petros (2:410/9 = 2:410/0 = 2:41/0) — host + password in nodes.inc.
# Point 2:410/51.1 (nsk1) — password in nodes.inc.

# Net 5030 / 5020 hosts: rbx1 can still *call out* to Russia even when
# Russia cannot call in. Useful for crash netmail and hub polls.
node 2:5030/0@fidonet f0.s0t.ru,217.71.231.2 -
node 2:5030/731@fidonet f731.s0t.ru,217.71.231.2 -
node 2:5020/0@fidonet n5020.ru -

# A relay since 2026-10-07: Boar tosses on spb1 (2:5030/1651). Every received
# file goes to spb1's filebox; spb1 emails the sysop. *F is the received path.
exec "/usr/local/lib/boar/ftn-forward-spb1.sh *F" *.pkt *.PKT *.su? *.mo? *.tu? *.we? *.th? *.fr? *.sa? *.SU? *.MO? *.TU? *.WE? *.TH? *.FR? *.SA?

include /etc/binkd/nodes.inc
