# binkd for Boar BBS (nsk1). Managed from ~/Documents/GitHub/boar/deploy/binkd.cfg.
#
# Until Region 41 assigns a node number this runs as 2:410/9999, the temporary
# address FidoNet Policy 4.07 suggests for a system applying to a net.

log /var/log/binkd/binkd.log
loglevel 4
conlog 4
percents

domain fidonet /var/spool/ftn/out 2
domain fido    alias-for fidonet

address 2:410/9999@fidonet
sysname "Boar BBS"
location "Saint Petersburg, Russia"
sysop "Mikhail Matveev"
nodeinfo 115200,TCP,BINKP

iport 24554
oport 24554
call-delay 60
rescan-delay 60
try 10
hold 10m

# Mail waiting for a node is only handed over in a password-protected
# session, or when we call it ourselves.
send-if-pwd

temp-inbound      /var/spool/ftn/tmp
inbound           /var/spool/ftn/in
inbound-nonsecure /var/spool/ftn/in.insecure
minfree 2048
minfree-nonsecure 2048
kill-dup-partial-files
kill-old-partial-files 1d
kill-old-bsy 12h
pid-file /run/binkd/binkd.pid
prescan

# Region 41 coordinator and Net 410 host (Petros Argyrakis). No session
# password until the link is agreed.
node 2:41/0@fidonet  dynamic.argyrakis.gr -
node 2:410/0@fidonet dynamic.argyrakis.gr -

# Net 5030 NorthWest_Net host (Alexey Antonyuk). No session password yet.
node 2:5030/0@fidonet f0.s0t.ru,217.71.231.2 -

# Tell the sysop by email when mail arrives. *S is the received file; it stays
# in the inbound for the BBS to import.
exec "/opt/boar/bin/boar-ftn notify -to xtreme@outlook.com *S" *.pkt *.PKT *.su? *.mo? *.tu? *.we? *.th? *.fr? *.sa? *.SU? *.MO? *.TU? *.WE? *.TH? *.FR? *.SA?

include /etc/binkd/nodes.inc
