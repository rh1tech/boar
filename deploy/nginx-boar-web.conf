# boar-sysop.rh1.tech: the Boar BBS sysop web interface.
#
# Reference copy of /etc/nginx/vhosts/boar-sysop.rh1.tech.conf on spb1.
# DNS-only, so nginx sees the real client address. Let's Encrypt certificate
# (certbot --nginx). The snippet is one proxy_pass to 127.0.0.1:8023 plus the
# Host and X-Real-IP headers.

limit_req_zone $binary_remote_addr zone=boar_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name boar-sysop.rh1.tech;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name boar-sysop.rh1.tech;

    ssl_certificate     /etc/letsencrypt/live/boar-sysop.rh1.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boar-sysop.rh1.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/boar-sysop.rh1.tech_access.log;
    error_log  /var/log/nginx/boar-sysop.rh1.tech_error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    location = /login {
        limit_req zone=boar_login burst=5 nodelay;
        include /etc/nginx/snippets/boar-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/boar-proxy.conf;
    }
}
