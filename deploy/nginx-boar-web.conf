# boar.rh1.tech: the sysop web interface.
#
# Reference copy of /etc/nginx/vhosts/boar.rh1.tech.conf on rbx1. The BBS
# serves plain HTTP on 127.0.0.1:8023 (-web); nginx terminates TLS in front of
# it. The name points straight at the server, not through Cloudflare, because
# telnet on 23 and SSH on 2222 share it, so the certificate is Let's Encrypt's
# rather than the Cloudflare origin certificate. It is issued and renewed by
# certbot with the dns-cloudflare plugin (/etc/certbot/cloudflare.ini), like the
# other Let's Encrypt certificates on the host, with a deploy hook that reloads
# nginx; port 80 only redirects.

# Login attempts are throttled inside the BBS too; this just keeps floods off it.
limit_req_zone $binary_remote_addr zone=boar_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name boar.rh1.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name boar.rh1.tech;

    ssl_certificate     /etc/letsencrypt/live/boar.rh1.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boar.rh1.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/boar.rh1.tech_access.log;
    error_log  /var/log/nginx/boar.rh1.tech_error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    location = /login {
        limit_req zone=boar_login burst=5 nodelay;
        include /etc/nginx/snippets/boar-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/boar-proxy.conf;
    }
}

