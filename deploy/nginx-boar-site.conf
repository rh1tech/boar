# boar.rh1.tech: the public page (site/ in this repository).
#
# Reference copy of /etc/nginx/sites-available/boar.rh1.tech on the home server.
# Static files in /var/www/boar-site, published by deploy/site.sh. boar.rh1.tech
# is also 2:410/51's address, answered by binkd on the home server. Callers use
# boar-bbs.rh1.tech (spb1); the sysop web interface is boar-sysop.rh1.tech
# (spb1). DNS-only at Cloudflare; Let's Encrypt certificate.

server {
    listen 80;
    listen [::]:80;
    server_name boar.rh1.tech;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name boar.rh1.tech;

    ssl_certificate     /etc/letsencrypt/live/boar.rh1.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boar.rh1.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/boar.rh1.tech_access.log;
    error_log  /var/log/nginx/boar.rh1.tech_error.log;

    root /var/www/boar-site;
    index index.html;
    error_page 404 /404.html;

    # xterm and the RH1 mark generate styles, not scripts.
    set $csp "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://boar.rh1.tech; font-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";

    location = /terminal/ws {
        proxy_pass https://boar-bbs.rh1.tech;
        proxy_ssl_server_name on;
        proxy_ssl_name boar-bbs.rh1.tech;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_http_version 1.1;
        proxy_set_header Host boar-bbs.rh1.tech;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Boar-Client-IP $remote_addr;
        proxy_read_timeout 20m;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
