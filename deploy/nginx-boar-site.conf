# boar.rh1.tech: the public page (site/ in this repository).
#
# Reference copy of /etc/nginx/vhosts/boar.rh1.tech.conf on spb1. Static files
# in /var/www/boar-site, published by deploy/site.sh. BBS telnet :23 and SSH
# :2222 share this hostname (DNS-only at Cloudflare). The sysop web interface
# is boar-sysop.rh1.tech. Let's Encrypt certificate (certbot --nginx).

server {
    listen 80;
    listen [::]:80;
    server_name boar.rh1.tech;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name boar.rh1.tech;

    ssl_certificate     /etc/letsencrypt/live/boar.rh1.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boar.rh1.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/boar.rh1.tech_access.log;
    error_log  /var/log/nginx/boar.rh1.tech_error.log;

    root /var/www/boar-site;
    index index.html;
    error_page 404 /404.html;

    set $csp "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";

    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
